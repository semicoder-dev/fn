name: FnChat
options:
  minimumXcodeGenVersion: 2.45.0
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Development.xcconfig
  Release: Config/Development.xcconfig
packages:
  FnChatUI:
    path: FnChatUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    INFOPLIST_KEY_FNCloudKitContainer: iCloud.com.semicoder.fn.development
    INFOPLIST_KEY_FNCommunicationEnvironment: development
    FN_CLOUDKIT_CONTAINER: iCloud.com.semicoder.fn.development
    INFOPLIST_KEY_CFBundleDisplayName: fn Chat Dev
targets:
  FnPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [iOS, Assets.xcassets]
    dependencies:
      - package: FnChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semicoder.fn.ios.dev
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/iOS-Info.plist
      properties:
        FNCloudKitContainer: iCloud.com.semicoder.fn.development
        FNCommunicationEnvironment: development
        UIBackgroundModes: [fetch, remote-notification]
  FnChatMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [macOS]
    info:
      path: build/macOS-Info.plist
      properties:
        FNCloudKitContainer: iCloud.com.semicoder.fn.development
        FNCommunicationEnvironment: development
    dependencies:
      - package: FnChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semicoder.fn.chat.dev
        CODE_SIGN_ENTITLEMENTS: Config/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleName: fn Chat Dev
  FnPhoneTestFlight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [iOS, Assets.xcassets]
    dependencies:
      - package: FnChatUI
    settings:
      base:
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.semicoder.fn.ios
        CODE_SIGN_ENTITLEMENTS: Config/iOSProduction.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        FN_CLOUDKIT_CONTAINER: iCloud.com.semicoder.fn.production
        INFOPLIST_KEY_FNCloudKitContainer: iCloud.com.semicoder.fn.production
        INFOPLIST_KEY_FNCommunicationEnvironment: production
        INFOPLIST_KEY_CFBundleDisplayName: fn
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/TestFlight-Info.plist
      properties:
        FNCloudKitContainer: iCloud.com.semicoder.fn.production
        FNCommunicationEnvironment: production
        UIBackgroundModes: [fetch, remote-notification]
        ITSAppUsesNonExemptEncryption: false
schemes:
  FnPhone:
    build:
      targets:
        FnPhone: all
  FnChatMac:
    build:
      targets:
        FnChatMac: all
  FnPhoneTestFlight:
    build:
      targets:
        FnPhoneTestFlight: all
    archive:
      config: Release
