name: Publish Fn SDK and UI

on:
  push:
    tags: ["sdk-v*"]
  # Manual runs validate and upload the archive, but never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fn-sdk-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      skip_disk_image: true

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v') && github.repository == 'semicoder-dev/fn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fn-sdk-npm
          path: npm-package
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - name: Check release tag against package versions
        run: bun scripts/npm/check.ts --release
      - name: Publish verified SDK and UI archives with OIDC
        env:
          SDK_FILE: ${{ needs.build.outputs.filename }}
          UI_FILE: ${{ needs.build.outputs.ui_filename }}
        run: bun scripts/npm/publish.ts "./npm-package/$SDK_FILE" "./npm-package/$UI_FILE"
      - name: Verify public bytes and install the released SDK/UI independently
        env:
          SDK_FILE: ${{ needs.build.outputs.filename }}
          UI_FILE: ${{ needs.build.outputs.ui_filename }}
        run: bun scripts/npm/verify-public.ts "./npm-package/$SDK_FILE" "./npm-package/$UI_FILE"
