name: Publish verified Fn candidate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: fn-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'semicoder-dev/fn'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.activate.outputs.page_url }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Resolve exact candidate artifact bound to this tag
        run: bun scripts/release/promote.ts --from-tag "$GITHUB_REF_NAME" release-bundle
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage immutable files without advancing latest.json
        run: bun scripts/release/publish.ts release-bundle published-site stage
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: staged-updates
          path: published-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: staged-updates
      - name: Verify staged files anonymously
        run: bun scripts/release/verify-public.ts release-bundle staged
      - name: Publish the identical installer and evidence
        run: bun scripts/release/publish.ts release-bundle published-site release
      - name: Verify public Release bytes
        run: bun scripts/release/verify-public.ts release-bundle release
      - name: Advance the feed after assets are verified
        run: bun scripts/release/publish.ts release-bundle published-site activate
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: active-updates
          path: published-site
      - name: Activate update feed
        id: activate
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: active-updates
      - name: Verify public feed and files
        run: bun scripts/release/verify-public.ts release-bundle active
  public-upgrade:
    needs: publish
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the promoted artifact, never rebuild
        run: bun scripts/release/promote.ts --from-tag "$GITHUB_REF_NAME" release-bundle
      - name: Exercise the real public update feed
        run: bun scripts/release/qa.ts release-bundle --public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fn-public-upgrade-evidence
          path: public-e2e.report.json
          if-no-files-found: error
          retention-days: 90
